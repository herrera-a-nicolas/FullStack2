<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis reservas · EspacioYa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container py-4">
  <h2 class="fw-bold mb-4">Reservar un espacio</h2>
  <div class="row g-4">
    <div class="col-12 col-lg-5">
      <div class="tarjeta p-4">
        <h5 id="tituloForm" class="mb-3">Nueva reserva</h5>
        <form id="formReserva" novalidate>
          <input type="hidden" id="reservaId">
          <div class="mb-3">
            <label for="espacio" class="form-label">Espacio</label>
            <select id="espacio" class="form-select"></select>
            <div class="invalid-feedback"></div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
              <label for="fecha" class="form-label">Fecha</label>
              <input type="date" id="fecha" class="form-control">
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12 col-sm-6">
              <label for="hora" class="form-label">Hora de inicio</label>
              <select id="hora" class="form-select"></select>
              <div class="invalid-feedback"></div>
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
              <label for="duracion" class="form-label">Duración (horas)</label>
              <input type="number" id="duracion" class="form-control" min="1" max="8" value="1">
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12 col-sm-6">
              <label for="personas" class="form-label">N° de personas</label>
              <input type="number" id="personas" class="form-control" min="1" value="1">
              <div class="invalid-feedback"></div>
            </div>
          </div>
          <div class="mb-3">
            <label for="tipo" class="form-label">Tipo de evento</label>
            <select id="tipo" class="form-select">
              <option value="">Selecciona...</option>
              <option>Cumpleaños</option>
              <option>Matrimonio</option>
              <option>Reunión empresarial</option>
              <option>Taller o capacitación</option>
              <option>Otro</option>
            </select>
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="notas" class="form-label">Notas <span class="text-secondary">(opcional)</span></label>
            <textarea id="notas" class="form-control" rows="2" maxlength="200"></textarea>
          </div>
          <p class="fs-5">Total estimado: <strong class="precio" id="resumen">$0</strong></p>
          <div class="d-flex flex-column flex-sm-row gap-2">
            <button type="submit" id="btnGuardar" class="btn btn-principal flex-fill">Reservar</button>
            <button type="button" id="btnCancelarEdicion" class="btn btn-outline-secondary flex-fill d-none">Cancelar edición</button>
            <button type="reset" id="btnLimpiar" class="btn btn-outline-secondary flex-fill">Limpiar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="col-12 col-lg-7">
      <div class="tarjeta p-4">
        <h5 class="mb-3">Mis reservas</h5>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead><tr><th>Espacio</th><th>Fecha</th><th>Horario</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="tablaReservas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils/formato.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/config/rutas.js"></script>
<script src="../data/seed.js"></script>
<script src="../js/models/usuario.model.js"></script>
<script src="../js/models/espacio.model.js"></script>
<script src="../js/models/reserva.model.js"></script>
<script src="../js/services/storage.service.js"></script>
<script src="../js/services/usuario.service.js"></script>
<script src="../js/services/espacio.service.js"></script>
<script src="../js/services/reserva.service.js"></script>
<script src="../js/services/auth.service.js"></script>
<script src="../js/components/layout.js"></script>
<script src="../js/controllers/reservas.controller.js"></script>
</body>
</html>
