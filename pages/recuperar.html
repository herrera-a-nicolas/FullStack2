<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña · EspacioYa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container">
  <div class="tarjeta form-card">
    <h2 class="fw-bold text-center mb-1">Recuperar contraseña</h2>

    <form id="formEmail" novalidate>
      <p class="text-center text-secondary">Ingresa el correo con el que te registraste</p>
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email">
        <div class="invalid-feedback"></div>
      </div>
      <div class="d-grid"><button type="submit" class="btn btn-principal">Enviar instrucciones</button></div>
    </form>

    <form id="formNueva" class="d-none" novalidate>
      <div class="alert alert-info small">
        Simulación: en un sistema real recibirías un enlace por correo. Aquí puedes definir tu nueva contraseña directamente.
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Nueva contraseña</label>
        <input type="password" class="form-control" id="clave" autocomplete="new-password">
        <div class="invalid-feedback"></div>
        <ul class="reglas-clave" id="reglas"></ul>
      </div>
      <div class="mb-3">
        <label for="clave2" class="form-label">Repetir nueva contraseña</label>
        <input type="password" class="form-control" id="clave2" autocomplete="new-password">
        <div class="invalid-feedback"></div>
      </div>
      <div class="d-grid"><button type="submit" class="btn btn-principal">Cambiar contraseña</button></div>
    </form>

    <p class="text-center small mt-3 mb-0"><a href="login.html">Volver a iniciar sesión</a></p>
  </div>
</main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils/formato.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/config/rutas.js"></script>
<script src="../data/seed.js"></script>
<script src="../js/models/usuario.model.js"></script>
<script src="../js/models/espacio.model.js"></script>
<script src="../js/models/reserva.model.js"></script>
<script src="../js/services/storage.service.js"></script>
<script src="../js/services/usuario.service.js"></script>
<script src="../js/services/espacio.service.js"></script>
<script src="../js/services/reserva.service.js"></script>
<script src="../js/services/auth.service.js"></script>
<script src="../js/components/layout.js"></script>
<script src="../js/controllers/recuperar.controller.js"></script>
</body>
</html>
