<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pago · EspacioYa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container">
  <div class="tarjeta form-card">
    <h2 class="fw-bold text-center mb-3">Pagar reserva</h2>
    <div id="detalle" class="mb-3"></div>

    <form id="formPago" novalidate>
      <div class="alert alert-warning small">Pago simulado: no se solicita ni se guarda ningún dato bancario.</div>
      <div class="mb-3">
        <label for="metodo" class="form-label">Método de pago</label>
        <select id="metodo" class="form-select">
          <option value="">Selecciona...</option>
          <option>Tarjeta de crédito</option>
          <option>Tarjeta de débito</option>
          <option>Transferencia</option>
        </select>
        <div class="invalid-feedback"></div>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="terminos">
        <label class="form-check-label" for="terminos">Acepto las condiciones de arriendo</label>
        <div class="invalid-feedback"></div>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-principal">Pagar ahora</button>
        <a href="reservas.html" class="btn btn-outline-secondary">Pagar después</a>
      </div>
    </form>

    <div id="exito" class="text-center d-none">
      <div style="font-size:3.5rem">✅</div>
      <h4 class="fw-bold">¡Pago realizado con éxito!</h4>
      <p class="text-secondary mb-1">Tu reserva quedó confirmada.</p>
      <p>Código: <strong id="codigoPago"></strong></p>
      <a href="reservas.html" class="btn btn-principal">Ver mis reservas</a>
    </div>
  </div>
</main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils/formato.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/config/rutas.js"></script>
<script src="../data/seed.js"></script>
<script src="../js/models/usuario.model.js"></script>
<script src="../js/models/espacio.model.js"></script>
<script src="../js/models/reserva.model.js"></script>
<script src="../js/services/storage.service.js"></script>
<script src="../js/services/usuario.service.js"></script>
<script src="../js/services/espacio.service.js"></script>
<script src="../js/services/reserva.service.js"></script>
<script src="../js/services/auth.service.js"></script>
<script src="../js/components/layout.js"></script>
<script src="../js/controllers/pago.controller.js"></script>
</body>
</html>
