<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · EspacioYa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container">
  <div class="tarjeta form-card">
    <h2 class="fw-bold text-center mb-1">Iniciar sesión</h2>
    <p class="text-center text-secondary">Ingresa con tu usuario o correo</p>
    <form id="formLogin" novalidate>
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario o correo</label>
        <input type="text" class="form-control" id="usuario" autocomplete="username">
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="clave" autocomplete="current-password">
        <div class="invalid-feedback"></div>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-principal">Ingresar</button>
      </div>
    </form>
    <div class="d-flex justify-content-between mt-3 small">
      <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      <a href="registro.html">Crear cuenta</a>
    </div>
    <div class="alert alert-info mt-4 small mb-0">
      <strong>Cuentas de prueba (educativo):</strong><br>
      Administrador → <code>admin</code> / <code>Admin123!</code><br>
      Cliente → <code>cliente</code> / <code>Cliente1!</code>
    </div>
  </div>
</main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils/formato.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/config/rutas.js"></script>
<script src="../data/seed.js"></script>
<script src="../js/models/usuario.model.js"></script>
<script src="../js/models/espacio.model.js"></script>
<script src="../js/models/reserva.model.js"></script>
<script src="../js/services/storage.service.js"></script>
<script src="../js/services/usuario.service.js"></script>
<script src="../js/services/espacio.service.js"></script>
<script src="../js/services/reserva.service.js"></script>
<script src="../js/services/auth.service.js"></script>
<script src="../js/components/layout.js"></script>
<script src="../js/controllers/login.controller.js"></script>
</body>
</html>
