<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel admin · EspacioYa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container py-4">
  <h2 class="fw-bold mb-3">Panel de administración</h2>

  <ul class="nav nav-pills mb-4 flex-column flex-sm-row gap-2" id="tabsAdmin" role="tablist">
    <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabEspacios" type="button">🏛️ Espacios</button></li>
    <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabReservas" type="button">📅 Reservas</button></li>
    <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabUsuarios" type="button">👥 Usuarios</button></li>
  </ul>

  <div class="tab-content">
    <!-- Mantenedor de espacios -->
    <div class="tab-pane fade show active" id="tabEspacios">
      <div class="row g-4">
        <div class="col-12 col-lg-4">
          <div class="tarjeta p-4">
            <h5 id="tituloEspacio" class="mb-3">Nuevo espacio</h5>
            <form id="formEspacio" novalidate>
              <input type="hidden" id="espId">
              <div class="mb-3"><label for="espNombre" class="form-label">Nombre</label>
                <input type="text" id="espNombre" class="form-control" maxlength="40"><div class="invalid-feedback"></div></div>
              <div class="row g-3 mb-3">
                <div class="col-6"><label for="espCapacidad" class="form-label">Capacidad</label>
                  <input type="number" id="espCapacidad" class="form-control" min="1"><div class="invalid-feedback"></div></div>
                <div class="col-6"><label for="espPrecio" class="form-label">Precio/hora</label>
                  <input type="number" id="espPrecio" class="form-control" min="1000" step="500"><div class="invalid-feedback"></div></div>
              </div>
              <div class="mb-3"><label for="espIcono" class="form-label">Ícono (emoji)</label>
                <input type="text" id="espIcono" class="form-control" maxlength="4" value="🏛️"><div class="invalid-feedback"></div></div>
              <div class="mb-3"><label for="espDescripcion" class="form-label">Descripción</label>
                <textarea id="espDescripcion" class="form-control" rows="3" maxlength="150"></textarea><div class="invalid-feedback"></div></div>
              <div class="d-flex flex-column flex-sm-row gap-2">
                <button type="submit" id="btnEspGuardar" class="btn btn-principal flex-fill">Agregar</button>
                <button type="button" id="btnEspCancelar" class="btn btn-outline-secondary flex-fill d-none">Cancelar</button>
              </div>
            </form>
          </div>
        </div>
        <div class="col-12 col-lg-8">
          <div class="tarjeta p-4"><div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead><tr><th>Espacio</th><th>Capacidad</th><th>Precio/hora</th><th>Acciones</th></tr></thead>
              <tbody id="tablaEspacios"></tbody>
            </table></div></div>
        </div>
      </div>
    </div>

    <!-- Reservas de todos los clientes -->
    <div class="tab-pane fade" id="tabReservas">
      <div class="tarjeta p-4"><div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>#</th><th>Cliente</th><th>Espacio</th><th>Fecha y hora</th><th>Total</th><th>Estado</th><th></th></tr></thead>
          <tbody id="tablaReservasAdmin"></tbody>
        </table></div></div>
    </div>

    <!-- Usuarios -->
    <div class="tab-pane fade" id="tabUsuarios">
      <div class="tarjeta p-4"><div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>Nombre</th><th>Usuario</th><th>Correo</th><th>Rol</th><th></th></tr></thead>
          <tbody id="tablaUsuarios"></tbody>
        </table></div></div>
    </div>
  </div>
</main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils/formato.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/config/rutas.js"></script>
<script src="../data/seed.js"></script>
<script src="../js/models/usuario.model.js"></script>
<script src="../js/models/espacio.model.js"></script>
<script src="../js/models/reserva.model.js"></script>
<script src="../js/services/storage.service.js"></script>
<script src="../js/services/usuario.service.js"></script>
<script src="../js/services/espacio.service.js"></script>
<script src="../js/services/reserva.service.js"></script>
<script src="../js/services/auth.service.js"></script>
<script src="../js/components/layout.js"></script>
<script src="../js/controllers/admin.controller.js"></script>
</body>
</html>
