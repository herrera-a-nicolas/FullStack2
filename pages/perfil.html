<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil · EspacioYa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container">
  <div class="tarjeta form-card" style="max-width: 760px;">
    <h2 class="fw-bold text-center mb-1">Mi perfil</h2>
    <p class="text-center text-secondary">Rol: <span class="badge bg-secondary" id="rolBadge"></span></p>
    <form id="formPerfil" novalidate>
      <div class="row g-3">
        <div class="col-12">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombre">
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-12 col-md-6">
          <label for="usuario" class="form-label">Nombre de usuario</label>
          <input type="text" class="form-control" id="usuario" readonly>
        </div>
        <div class="col-12 col-md-6">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email">
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-12 col-md-6">
          <label for="nacimiento" class="form-label">Fecha de nacimiento</label>
          <input type="date" class="form-control" id="nacimiento">
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-12 col-md-6">
          <label for="direccion" class="form-label">Dirección <span class="text-secondary">(opcional)</span></label>
          <input type="text" class="form-control" id="direccion" maxlength="100">
          <div class="invalid-feedback"></div>
        </div>
      </div>

      <hr class="my-4">
      <h5>Cambiar contraseña <span class="text-secondary fs-6">(opcional)</span></h5>
      <div class="row g-3">
        <div class="col-12">
          <label for="claveActual" class="form-label">Contraseña actual</label>
          <input type="password" class="form-control" id="claveActual" autocomplete="current-password">
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-12 col-md-6">
          <label for="clave" class="form-label">Nueva contraseña</label>
          <input type="password" class="form-control" id="clave" autocomplete="new-password">
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-12 col-md-6">
          <label for="clave2" class="form-label">Repetir nueva contraseña</label>
          <input type="password" class="form-control" id="clave2" autocomplete="new-password">
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-12"><ul class="reglas-clave" id="reglas"></ul></div>
      </div>

      <div class="d-flex flex-column flex-sm-row gap-2 mt-3">
        <button type="submit" class="btn btn-principal flex-fill">Guardar cambios</button>
        <button type="button" id="btnRestablecer" class="btn btn-outline-secondary flex-fill">Restablecer</button>
      </div>
    </form>
  </div>
</main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils/formato.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/config/rutas.js"></script>
<script src="../data/seed.js"></script>
<script src="../js/models/usuario.model.js"></script>
<script src="../js/models/espacio.model.js"></script>
<script src="../js/models/reserva.model.js"></script>
<script src="../js/services/storage.service.js"></script>
<script src="../js/services/usuario.service.js"></script>
<script src="../js/services/espacio.service.js"></script>
<script src="../js/services/reserva.service.js"></script>
<script src="../js/services/auth.service.js"></script>
<script src="../js/components/layout.js"></script>
<script src="../js/controllers/perfil.controller.js"></script>
</body>
</html>
